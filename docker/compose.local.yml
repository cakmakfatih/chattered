name: chattered-local

services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_local_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: arigaio/atlas:1.3.3-community-alpine
    restart: "no"
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ../server/atlas.hcl:/app/atlas.hcl:ro
      - ../server/migrations:/app/migrations:ro
    command:
      - migrate
      - apply
      - --env
      - local
      - --config
      - file:///app/atlas.hcl
    depends_on:
      postgres:
        condition: service_healthy

  background:
    build:
      context: ../background
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.local
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_local_data:
    name: chattered_local_postgres_data
  redis_local_data:
    name: chattered_local_redis_data
