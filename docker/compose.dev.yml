services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    env_file:
      - ../.env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2-alpine3.23
    restart: unless-stopped
    env_file:
      - ../.env.dev
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  background:
    build:
      context: ../background
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - ../.env.dev
    depends_on:
      redis:
        condition: service_healthy

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.dev
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: ..
      dockerfile: docker/caddy/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "443:443/tcp"
    volumes:
      - ./caddy/Caddyfile.bootstrap:/etc/caddy/Caddyfile.bootstrap:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_certs:/certs:ro
    command:
      - run
      - --config
      - /etc/caddy/Caddyfile.bootstrap
      - --adapter
      - caddyfile

  acme:
    image: neilpang/acme.sh:3.1.6
    restart: unless-stopped
    environment:
      AUTO_UPGRADE: "0"
      LE_CONFIG_HOME: /acme.sh
      LE_WORKING_DIR: /acmebin
    entrypoint:
      - /bin/sh
      - /scripts/entrypoint.sh
    depends_on:
      caddy:
        condition: service_started
    volumes:
      - ./acme:/scripts:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_certs:/certs
      - acme_data:/acme.sh

volumes:
  postgres_data:
    name: chattered_postgres_data
  redis_data:
    name: chattered_redis_data
  caddy_data:
    name: chattered_caddy_data
  caddy_config:
    name: chattered_caddy_config
  caddy_certs:
    name: chattered_caddy_certs
  acme_data:
    name: chattered_acme_data
